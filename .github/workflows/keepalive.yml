name: Keep database awake
# Free Supabase projects pause after about a week with no activity.
# This pings the database every 3 days so the site stays up between trips. Free.

on:
  schedule:
    - cron: "17 15 */3 * *" # ~7:17am Pacific every 3rd day
  workflow_dispatch:

permissions:
  actions: write # lets the job re-enable itself (see last step)

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Supabase
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Add SUPABASE_URL and SUPABASE_PUBLISHABLE_KEY repository secrets (docs/SETUP.md, step 5)."
            exit 1
          fi
          curl --fail --silent --show-error --retry 3 --retry-delay 20 \
            -X POST "$SUPABASE_URL/rest/v1/rpc/keepalive" \
            -H "apikey: $SUPABASE_KEY" \
            -H "Content-Type: application/json" \
            -d '{}'
          echo
          echo "Database is awake."

      # GitHub turns off scheduled workflows in public repos after 60 days without
      # commits. Re-enabling via the API resets that clock so this never silently stops.
      - name: Keep this schedule from being auto-disabled
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/keepalive.yml/enable" || true
          gh api -X PUT "repos/${{ github.repository }}/actions/workflows/backup.yml/enable" || true
